name: Notary Diagnostic

# Manually-triggered: query the TRUE final state of notarization submissions
# without running a full build. notarytool history/info/log only need the
# Apple ID credentials, so this runs in ~1 min on the mac runner and tells us
# whether a submission that timed out our poller ever actually resolved.

on:
  workflow_dispatch:
    inputs:
      submission_ids:
        description: "Space-separated submission IDs to inspect (info + log). Leave blank to just dump history."
        required: false
        default: ""

jobs:
  diag:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Query notarization history + per-submission status
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -uo pipefail
          CRED=(--apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID")

          echo "================ notarytool history ================"
          echo "(most recent submissions and their CURRENT status — the"
          echo " 'status' column is the ground truth we couldn't see live)"
          echo ""
          xcrun notarytool history "${CRED[@]}" || echo "history call failed"
          echo ""

          IDS="${{ github.event.inputs.submission_ids }}"
          if [ -z "$IDS" ]; then
            echo "No submission IDs given — history above is the result."
            exit 0
          fi

          for id in $IDS; do
            echo "================ info: $id ================"
            xcrun notarytool info "$id" "${CRED[@]}" || echo "info failed for $id"
            echo ""
            echo "================ log: $id ================"
            xcrun notarytool log "$id" "${CRED[@]}" || echo "log failed for $id (may not be ready)"
            echo ""
          done
