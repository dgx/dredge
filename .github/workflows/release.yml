name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: electron:build:win
            artifacts: |
              dist-electron/*.exe
              dist-electron/*.exe.blockmap
              dist-electron/latest.yml
          - os: macos-14
            script: electron:build:mac
            artifacts: |
              dist-electron/*.dmg
              dist-electron/*.dmg.blockmap
              dist-electron/latest-mac.yml

    runs-on: ${{ matrix.os }}
    # Cap the job so a real hang fails fast. Apple's notarization queue
    # can legitimately take 45+ min during peak load (observed), so the
    # headroom accommodates that without burning the whole 6h GHA default.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Import the Developer ID cert into a temp keychain *before*
      # electron-builder runs. apple-actions/import-codesign-certs handles
      # `security set-key-partition-list` for us, which is what codesign
      # needs in order to access the key without a UI prompt.
      - name: Import macOS signing certificate
        if: matrix.os == 'macos-14'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.CSC_LINK }}
          p12-password: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        timeout-minutes: 60
        run: npm run ${{ matrix.script }} -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The afterSign hook (scripts/notarize.cjs) submits to Apple's notary
      # service with --no-wait and polls, logging [notarize] status lines so
      # the GHA log shows live progress instead of a silent multi-minute block.
      - name: Build (macOS)
        if: matrix.os == 'macos-14'
        timeout-minutes: 75
        run: npm run ${{ matrix.script }} -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CSC_LINK intentionally NOT set — the cert is already in the
          # keychain from the import step above, and electron-builder will
          # auto-discover the Developer ID Application identity from it.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Fail the build if notarization doesn't complete — never ship an
          # un-stapled DMG. (Account is warm; notarization completes in minutes.)
          NOTARIZE_REQUIRED: "1"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifacts }}
