name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: electron:build:win
            artifacts: |
              dist-electron/*.exe
              dist-electron/*.exe.blockmap
              dist-electron/latest.yml
          - os: macos-14
            script: electron:build:mac
            artifacts: |
              dist-electron/*.dmg
              dist-electron/*.dmg.blockmap
              dist-electron/latest-mac.yml

    runs-on: ${{ matrix.os }}
    # Cap the job so a real hang fails fast. Apple's notarization queue
    # can legitimately take 30+ min during peak load, so the headroom is
    # set to accommodate that without burning the whole 6h GHA default.
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Import the Developer ID cert into a temp keychain *before*
      # electron-builder runs. apple-actions/import-codesign-certs handles
      # `security set-key-partition-list` for us, which is what codesign
      # needs in order to access the key without a UI prompt.
      - name: Import macOS signing certificate
        if: matrix.os == 'macos-14'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.CSC_LINK }}
          p12-password: ${{ secrets.CSC_KEY_PASSWORD }}

      # Diagnostic: split the signing pipeline into its three parts (keychain
      # ACL, network to Apple's TSA, codesign with timestamp) and test each
      # in isolation, so a failure tells us which one is broken instead of
      # leaving us guessing. Uses a pure-shell watchdog because gtimeout
      # isn't preinstalled on macos-14 ARM runners.
      - name: Probe codesign pipeline
        if: matrix.os == 'macos-14'
        run: |
          set -uo pipefail

          # POSIX timeout: run "$@", kill after $1 seconds if still running.
          run_with_timeout() {
            local secs=$1; shift
            "$@" &
            local pid=$!
            ( sleep "$secs"; kill -TERM "$pid" 2>/dev/null ) &
            local watchdog=$!
            wait "$pid"; local rc=$?
            kill -TERM "$watchdog" 2>/dev/null; wait "$watchdog" 2>/dev/null || true
            return "$rc"
          }

          echo "=== keychains ==="
          security list-keychains -d user
          security default-keychain
          echo ""
          echo "=== codesigning identities ==="
          security find-identity -v -p codesigning
          IDENTITY=$(security find-identity -v -p codesigning \
            | awk -F'"' '/Developer ID Application/ { print $2; exit }')
          if [ -z "$IDENTITY" ]; then
            echo "✗ no Developer ID Application identity found"; exit 1
          fi
          echo "Using identity: $IDENTITY"
          echo ""

          echo "=== probe 1: network reachability to timestamp.apple.com ==="
          curl -sS --connect-timeout 10 --max-time 20 -o /dev/null \
            -w "HTTP %{http_code}, connect=%{time_connect}s, total=%{time_total}s\n" \
            http://timestamp.apple.com/ts01 \
            || echo "✗ couldn't reach timestamp.apple.com (TSA) — TSA-based signing will hang"
          echo ""

          cat > /tmp/hello.c <<'C'
          int main(void) { return 0; }
          C
          cc /tmp/hello.c -o /tmp/hello1
          cp /tmp/hello1 /tmp/hello2

          echo "=== probe 2: codesign WITHOUT --timestamp (no network needed) ==="
          if run_with_timeout 30 codesign \
              --sign "$IDENTITY" --options runtime --force --verbose=4 \
              /tmp/hello1; then
            echo "✓ keychain access works (codesign can use the key)"
          else
            echo "✗ codesign without --timestamp failed/hung — keychain ACL is broken"
            exit 1
          fi
          echo ""

          echo "=== probe 3: codesign WITH --timestamp (uses TSA over network) ==="
          if run_with_timeout 90 codesign \
              --sign "$IDENTITY" --timestamp --options runtime --force --verbose=4 \
              /tmp/hello2; then
            echo "✓ timestamp.apple.com is responding; full codesign pipeline healthy"
          else
            echo "✗ codesign WITH --timestamp failed/hung — TSA is unreachable or unresponsive"
            echo "  electron-builder's signing step will hang the same way."
            exit 1
          fi

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        timeout-minutes: 60
        run: npm run ${{ matrix.script }} -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Mac build runs with an inline phase tracker so the GHA log shows
      # what's actually happening every 20s — signing which binary, or
      # waiting on Apple's notarization queue with elapsed time. Without
      # this, electron-builder prints `signing ...` once and then says
      # nothing for 5-20+ min while notarytool blocks on Apple, which
      # *looks* identical to a hang even when everything's fine.
      - name: Build (macOS, with live phase tracking)
        if: matrix.os == 'macos-14'
        timeout-minutes: 60
        run: |
          set -uo pipefail

          # Print a one-line status describing what the build is doing now.
          phase_line() {
            local cs_pid nt_pid pid_cmd file elapsed
            cs_pid=$(pgrep -f 'codesign --sign' 2>/dev/null | head -1)
            nt_pid=$(pgrep -f 'notarytool submit' 2>/dev/null | head -1)
            if [ -n "$cs_pid" ]; then
              pid_cmd=$(ps -o command= -p "$cs_pid" 2>/dev/null)
              file=$(printf '%s' "$pid_cmd" | grep -oE '/[^ ]+\.app/[^ ]+' | tail -1)
              printf '>> [%s] SIGNING: %s\n' "$(date -u +%H:%M:%S)" "${file##*/}"
            elif [ -n "$nt_pid" ]; then
              elapsed=$(ps -o etime= -p "$nt_pid" 2>/dev/null | tr -d ' ')
              printf '>> [%s] NOTARIZING — waiting on Apple (elapsed: %s, typical: 2-15 min)\n' \
                "$(date -u +%H:%M:%S)" "${elapsed:-?}"
            else
              printf '>> [%s] electron-builder phase (packaging / dmg / stapling / other)\n' \
                "$(date -u +%H:%M:%S)"
            fi
          }

          # Background tracker — stdout lines interleave live in the GHA log
          # with electron-builder's own output.
          (
            while sleep 20; do
              phase_line || true
            done
          ) &
          TRACKER_PID=$!
          trap "kill $TRACKER_PID 2>/dev/null || true" EXIT

          npm run ${{ matrix.script }} -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CSC_LINK intentionally NOT set — the cert is already in the
          # keychain from the import step above, and electron-builder will
          # auto-discover the Developer ID Application identity from it.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DEBUG: electron-builder

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifacts }}
