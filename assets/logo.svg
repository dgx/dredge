<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" role="img" aria-label="Dredge">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbe6a0"/>
      <stop offset="35%" stop-color="#e8c668"/>
      <stop offset="75%" stop-color="#b38a3a"/>
      <stop offset="100%" stop-color="#7a5a1f"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-20%" width="110%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0" flood-color="#000" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#e8c668" flood-opacity="0.18"/>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@900&amp;display=swap');
      .wordmark {
        font-family: 'Cinzel', 'Trajan Pro', 'Times New Roman', serif;
        font-weight: 900;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }
    </style>
  </defs>
  <rect width="800" height="180" fill="#16120b"/>
  <line x1="60" y1="150" x2="740" y2="150" stroke="url(#gold)" stroke-width="1" opacity="0.35"/>
  <text x="400" y="118" class="wordmark" font-size="96" fill="url(#gold)" text-anchor="middle" filter="url(#shadow)">Dredge</text>
</svg>
